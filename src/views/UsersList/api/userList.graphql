query GetUsers(
    $pageSize: Int = 10
    $pageNumber: Int = 1
    $sortBy: String = "createdAt"
    $sortDirection: SortDirection = desc
    $searchTerm: String
    $statusFilter: UserBlockStatus = ALL
) {
    getUsers(
        pageSize: $pageSize
        pageNumber: $pageNumber
        sortBy: $sortBy
        sortDirection: $sortDirection
        searchTerm: $searchTerm
        statusFilter: $statusFilter
    ) {
        users {
            id
            userName
            createdAt
            email
            profile {
                id
                createdAt
            }
            userBan {
                reason
                createdAt
            }
        }
        pagination {
            totalCount
            pagesCount
            page
        }
    }
}
