query GetPaymentsByUser(
    $userId:Int!
    $pageSize:Int
    $pageNumber: Int
    $sortBy: String
    $sortDirection: SortDirection){

    getPaymentsByUser(
        pageSize: $pageSize,
        pageNumber: $pageNumber,
        userId: $userId,
        sortBy: $sortBy,
        sortDirection: $sortDirection){
    pagesCount,
        page,
        pageSize,
        totalCount,
        items {
            id,
            status,
            dateOfPayment,
            endDate,
            type,
            price,
            payments {
                id
            }
        }
    }
}